<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inputs · Model 2 (dev)</title>
<link rel="stylesheet" href="assets/site.css?v=e36837a-1794683326">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=Source+Code+Pro:wght@400;500&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;600;700;800&display=swap">
<style>
  .wkv { display: grid; grid-template-columns: 200px 1fr; gap: 6px 16px; max-width: 900px; font-size: 14px; }
  .wkv .k { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; padding-top: 2px; }
  .wid { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 15px; font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1>Overview</h1>
  <div class="sub" id="intro"></div>
  <style>#intro p { margin: 0 0 8px; max-width: 90ch; } #intro ul { max-width: 90ch; } #intro ul { margin: 0 0 8px; padding-left: 20px; } #intro li { margin: 0 0 4px; }</style>
  <h2>This world</h2>
  <div class="wkv" id="who"></div>
  <h2>What it contains</h2>
  <div class="wkv" id="what"></div>
</main>
<script src="assets/site.js?v=e36837a-1794683326"></script>
<script>
(async () => {
  try {
    const [meta, w] = await Promise.all([M2.load("meta.json"), M2.load("world.json")]);
    M2.header(meta, "world_overview.html");
    const [idx, sid] = [await M2.sets(), await M2.currentSet()];
    const wid = (idx.sets.find((x) => x.id === sid) || {}).world_catalog_id || w.catalog_id;   // the world's lasting id
    document.querySelector("h1").textContent = `Overview of World ${wid || "(not in the catalog)"}`;
    const st = w.stats || {}, n = (v) => (v ?? 0).toLocaleString();
    const synthetic = w.kind === "synthetic";
    const made = w.created_utc ? `, generated ${w.created_utc.slice(0, 10)}` : "";
    const rules = w.misspecification ? `, with deliberately altered equations (${M2.esc(w.misspecification)})` : ", with the model's own equations";
    document.getElementById("intro").innerHTML = `
      <p><b>A world is everything Model 2 is allowed to know.</b> Every forecast is made inside one world, and sees only
      what that world had published by the forecast's as-of date.</p>
      <p>A world has three kinds of input:</p>
      <ul>
        <li><b>Entities</b>: the businesses the model follows, such as plants, stores, data centers and hospitals, and the
        companies that own or run them. Some are <i>tracked</i> one by one. Others are <i>representative</i> entities, each
        standing in for many small establishments of one size and region that are not tracked individually. Every fact
        carries dates, so entities can open, close or change hands.</li>
        <li><b>Observations</b>: scattered public readings about those entities or groups of them, such as a quarterly
        filing, an announced plant, a stated capacity, a price list or an emissions report. Each is dated by when it
        became public.</li>
        <li><b>The sector input bundle</b>: a delivery from an outside source for each as-of date. For every sector it
        brings drivers, such as demand, price and input cost, which influence the entities' activity. It also brings
        official sector statistics, which constrain the entities' total.</li>
      </ul>
      <p>What a world does <i>not</i> show is just as important. Each entity's capacity, order book, costs and other
      <b>hidden quantities</b> are never observed directly; estimating them is the model's job.</p>
      <p>The <b>model configuration</b> is an input too, but it belongs to the model, not the world. It holds fixed values
      and starting ranges chosen by people, and the same configuration can be run on many worlds.</p>
      <p><b>Synthetic and real worlds.</b> A <i>synthetic</i> world is generated by a simulation, using Model 2's own
      equations and parameters we choose. Its entities, companies and observations are invented, but its sectors, sizes,
      data sources and publication schedules imitate real ones. Because the simulation knows the true value of every
      hidden quantity and parameter, forecasts on a synthetic world can be scored exactly. That is how we test whether
      the model can recover what generated the data. A different random seed draws a different world under the same
      rules. A <i>real</i> world is built from public sources. No one knows its hidden quantities, so its forecasts can be
      scored only against figures published later. Every world so far is synthetic.</p>
      <p><i>This world</i> is ${synthetic
        ? `synthetic: seed ${M2.esc(w.seed ?? "unknown")}${made}${rules}.`
        : `real, built from public sources${made}.`}</p>`;
    const row = (k, v) => v == null || v === "" ? "" : `<span class="k">${k}</span><span>${v}</span>`;
    const when = w.created_utc ? `${w.created_utc.slice(0, 10)} at ${w.created_utc.slice(11, 16)} UTC` : null;
    document.getElementById("who").innerHTML = [
      row("World", `<span class="wid">${M2.esc(wid || "not in the catalog")}</span>`),
      row("Name", w.id && `${M2.esc(w.id)} <span class="muted">(its generator and seed; a readable label, not an identifier)</span>`),
      row("Kind", synthetic ? "synthetic (simulated, with a known truth)" : "real (no known truth)"),
      row("Generator version", w.generator && M2.esc(w.generator)),
      row("Random seed", w.seed != null ? `${w.seed} <span class="muted">(another seed draws another world under the same rules)</span>` : null),
      row("Model variant", w.misspecification ? M2.esc(w.misspecification) : synthetic ? "the model's own equations" : null),
      row("Created", when),
      row("Code version", w.code_commit && `<span class="mono">${M2.esc(w.code_commit.slice(0, 7))}</span>`),
      row("As-of dates prepared", (w.as_of || []).join(", ")),
    ].join("");
    document.getElementById("what").innerHTML = [
      row("Sectors", n(st.sectors)),
      row("Entities", `${n(st.entities)}: ${n(st.tracked)} tracked and ${n(st.representative)} representative, covering
        ${n(st.establishments)} establishments in all — <a href="world_entities.html">see them</a>`),
      row("Companies and sites", `${n(st.companies)} companies, ${n(st.sites)} sites, ${n(st.ownership_links)} ownership links between companies`),
      row("Observations", `${n(st.observations)} of ${n(st.observation_kinds)} kinds from ${n(st.sources)} sources, published
        ${(st.first_published || "").slice(0, 7)} to ${(st.last_published || "").slice(0, 7)} — <a href="world_observations.html">see the kinds</a>`),
      row("Sector input bundle", `${n(st.bundles)} deliveries, for ${(st.bundle_dates || []).join(", ")} — <a href="world_bundle.html">see the latest</a>`),
      row(synthetic ? "Simulated months" : "Months covered", st.truth_from ? `${st.truth_from} to ${st.truth_to}` : null),
    ].join("");
  } catch (e) { M2.fail(e); }
})();
</script>
</body>
</html>
