<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>World Inputs · Model 2</title>
<link rel="stylesheet" href="assets/site.css?v=f1f4148-1794919189">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=Source+Code+Pro:wght@400;500&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;600;700;800&display=swap">
<style>
  .wkv { display: grid; grid-template-columns: 200px 1fr; gap: 6px 16px; max-width: 900px; font-size: 14px; }
  .wkv .k { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; padding-top: 2px; }
  .wid { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 15px; font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1>Overview</h1>
  <div class="sub" id="intro"></div>
  <style>#intro p { margin: 0 0 8px; max-width: 90ch; } #intro ul { max-width: 90ch; } #intro ul { margin: 0 0 8px; padding-left: 20px; } #intro li { margin: 0 0 4px; }</style>
  <h2>This world bundle</h2>
  <div class="wkv" id="who"></div>
  <h2>Its worlds</h2>
  <p class="sub">Each row is one world of the bundle; its links show that world on the pages about one world.</p>
  <div class="tablewrap"><table id="worlds"></table></div>
</main>
<script src="assets/site.js?v=f1f4148-1794919189"></script>
<script>
(async () => {
  try {
    const [meta, w] = await Promise.all([M2.load("meta.json"), M2.load("world.json")]);
    M2.header(meta, "world_overview.html");
    const [idx, ch] = [await M2.sets(), await M2.choice()];
    // data from before forecast sets: the one world shown is a bundle of one
    const fs = ch.fs || { id: ch.set, world_bundle: null, size: 1, kind: w.kind, generator: w.generator,
      misspecification: w.misspecification, as_of: w.as_of,
      members: [{ set: ch.set, seed: w.seed, world: w.id, world_catalog_id: (idx.sets.find((x) => x.id === ch.set) || {}).world_catalog_id || w.catalog_id }] };
    document.querySelector("h1").textContent = `Overview of World Bundle ${fs.world_bundle || "(not in the catalog)"}`;
    const synthetic = fs.kind === "synthetic";
    const seeds = fs.members.map((m) => m.seed).filter((s) => s != null);
    const rules = fs.misspecification ? `with deliberately altered equations (${M2.esc(fs.misspecification)})` : "with the model's own equations";
    document.getElementById("intro").innerHTML = `
      <p><b>A world is everything Model 2 is allowed to know.</b> Every forecast is made inside one world, and sees only
      what that world had published by the forecast's as-of date.</p>
      <p>A world has three kinds of input:</p>
      <ul>
        <li><b>Entities</b>: the businesses the model follows, such as plants, stores, data centers and hospitals, and the
        companies that own or run them. Some are <i>tracked</i> one by one. Others are <i>representative</i> entities, each
        standing in for many small establishments of one size and region that are not tracked individually. Every fact
        carries dates, so entities can open, close or change hands.</li>
        <li><b>Observations</b>: scattered public readings about those entities or groups of them, such as a quarterly
        filing, an announced plant, a stated capacity, a price list or an emissions report. Each is dated by when it
        became public.</li>
        <li><b>The sector input delivery</b>: a delivery from an outside source for each as-of date. For every sector it
        brings drivers, such as demand, price and input cost, which influence the entities' activity. It also brings
        official sector statistics, which constrain the entities' total.</li>
      </ul>
      <p>What a world does <i>not</i> show is just as important. Each entity's capacity, order book, costs and other
      <b>hidden quantities</b> are never observed directly; estimating them is the model's job.</p>
      <p><b>Synthetic and real worlds.</b> A <i>synthetic</i> world is generated by a simulation, using Model 2's own
      equations and parameters we choose. Its entities, companies and observations are invented, but its sectors, sizes,
      data sources and publication schedules imitate real ones. Because the simulation knows the true value of every
      hidden quantity and parameter, forecasts on a synthetic world can be scored exactly. That is how we test whether
      the model can recover what generated the data. A <i>real</i> world is built from public sources. No one knows its
      hidden quantities, so its forecasts can be scored only against figures published later. Every world so far is
      synthetic.</p>
      <p><b>World bundles.</b> The site describes a <i>world bundle</i>: one or more worlds made by the same generator
      under the same rules. A different random seed draws a different synthetic world, with other true parameters, other
      histories and other observations. Running the model on every world of a bundle shows which of its strengths and
      weaknesses hold across worlds and which come from one world's random draws. A real world is a bundle of exactly
      one.</p>
      <p>The <b>model configuration</b> is an input too, but it belongs to the model, not the worlds: the same model, with
      the same configuration, runs on every world of the bundle.</p>
      <p><i>This bundle</i> holds ${fs.size === 1 ? "one world" : `${fs.size} worlds`}, ${synthetic
        ? `synthetic, ${rules}: seed${seeds.length === 1 ? "" : "s"} ${M2.esc(seeds.join(", "))}.`
        : "real, built from public sources."}</p>`;
    const row = (k, v) => v == null || v === "" ? "" : `<span class="k">${k}</span><span>${v}</span>`;
    document.getElementById("who").innerHTML = [
      row("World bundle", `<span class="wid">${M2.esc(fs.world_bundle || "not in the catalog")}</span>`),
      row("Kind", synthetic ? "synthetic (simulated, with a known truth)" : "real (no known truth)"),
      row("Worlds", `${fs.size}${fs.size > 1 ? " <span class=\"muted\">(fixed when the bundle was made)</span>" : ""}`),
      row("Generator version", fs.generator && M2.esc(fs.generator)),
      row("Random seeds", seeds.length ? `${M2.esc(seeds.join(", "))} <span class="muted">(one per world)</span>` : null),
      row("Model variant", fs.misspecification ? M2.esc(fs.misspecification) : synthetic ? "the model's own equations" : null),
      row("As-of dates prepared", (fs.as_of || []).join(", ")),
    ].join("");
    const worlds = await Promise.all(fs.members.map((m) => m.set ? M2.loadFor(m.set, "world.json").catch(() => null) : null));
    const n = (v) => (v ?? 0).toLocaleString();
    const link = (m, page, text) => m.set ? `<a href="${M2.worldHref(page, fs, m)}">${text}</a>` : text;
    document.getElementById("worlds").innerHTML = `<tr><th>world</th><th class="n">seed</th><th>created</th>
      <th class="n">entities</th><th class="n">tracked</th><th class="n">companies</th><th class="n">observations</th>
      <th class="n">sector input deliveries</th><th>${synthetic ? "simulated months" : "months covered"}</th></tr>` +
      fs.members.map((m, i) => {
        const x = worlds[i], st = (x && x.stats) || {};
        if (!x) return `<tr><td class="mono">${M2.esc(m.world_catalog_id)}</td><td class="n">${M2.esc(m.seed ?? "")}</td>
          <td colspan="7" class="muted">not built for the site</td></tr>`;
        return `<tr${m === ch.member ? ' class="on"' : ""}><td class="mono" title="${M2.esc(m.world_catalog_id)}">${M2.esc((m.world_catalog_id || "").slice(0, 8))}
          <span class="muted">${M2.esc(x.id || "")}</span></td><td class="n">${M2.esc(m.seed ?? "")}</td>
          <td>${M2.esc((x.created_utc || "").slice(0, 10))}</td>
          <td class="n">${link(m, "world_entities.html", n(st.entities))}</td><td class="n">${n(st.tracked)}</td>
          <td class="n">${n(st.companies)}</td><td class="n">${link(m, "world_observations.html", n(st.observations))}</td>
          <td class="n">${link(m, "world_bundle.html", n(st.bundles))}</td>
          <td>${st.truth_from ? `${st.truth_from} to ${st.truth_to}` : ""}</td></tr>`;
      }).join("");
  } catch (e) { M2.fail(e); }
})();
</script>
</body>
</html>
