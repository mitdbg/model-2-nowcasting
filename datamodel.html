<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Data Model · Model 2 (dev)</title>
<link rel="stylesheet" href="assets/site.css?v=f80bffa-1794677900">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=Source+Code+Pro:wght@400;500&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="assets/datamodel.css?v=f80bffa-1794677900">
</head>
<body>
<main>
  <h1>Data Model</h1>
  <p class="sub">This diagram shows Model 2's data as related tables, grouped into families and arranged by the
  phase that uses them. Click a table to see its columns, its key and how it joins to the others.</p>
  <div id="explorer"></div>
</main>
<script src="assets/site.js?v=f80bffa-1794677900"></script>
<script src="assets/datamodel.js?v=f80bffa-1794677900"></script>
<script>
(async () => {
  try {
    const [meta, model] = await Promise.all([M2.load("meta.json"), M2.load("datamodel.json")]);
    M2.header(meta, "datamodel.html");
    DataModel.render(document.getElementById("explorer"), model, {
      selected: M2.param("t"),
      onSelect: (t) => history.replaceState(null, "", t ? `?t=${encodeURIComponent(t)}` : location.pathname),
    });
  } catch (e) {
    document.querySelector("main").insertAdjacentHTML("beforeend", `<p class="note">Could not load the data model: ${M2.esc(e.message)}</p>`);
  }
})();
</script>
</body>
</html>
