<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Improvement Testing · Model 2 (dev)</title>
<link rel="stylesheet" href="assets/site.css?v=f80bffa-1794677900">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=Source+Code+Pro:wght@400;500&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;600;700;800&display=swap">
<style>
  main > p { max-width: 80ch; }
  .how { background: var(--band2); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; max-width: 900px; font-size: 13.5px; margin-bottom: 14px; }
  table.tests { font-size: 13px; }
  /* the headings stay in view below the sub-tabs while rows remain; that needs the table outside a sideways-scrolling
     box, so on narrow screens (where it must scroll sideways) they scroll away */
  @media (min-width: 900px) {
    #wrap.tablewrap { overflow: visible; }
    table.tests thead th { position: sticky; top: calc(var(--hdr, 43px) + var(--sub, 0px)); z-index: 2; background: var(--bg);
      box-shadow: inset 0 -1px 0 var(--line); vertical-align: bottom; white-space: normal; }
  }
  table.tests tr { scroll-margin-top: calc(var(--hdr, 48px) + var(--sub, 0px) + 44px); }
  table.tests tr.hit { background: var(--band2); }
  table.tests td.id { font-weight: 600; white-space: nowrap; }
  .pid { display: block; font-weight: 400; font-size: 11px; color: var(--muted); font-family: "IBM Plex Mono", ui-monospace, monospace; }
  table.tests td.p { width: 15%; }
  table.tests td.t { width: 16%; }
  table.tests td.s { width: 38%; }
  table.tests td.n { white-space: nowrap; }
  table.tests tr.untried td { color: var(--muted); }
  table.tests tr.untried td a { color: var(--muted); }
  table.tests tfoot td { font-weight: 600; border-top: 1px solid var(--fg); }
  .st { font-weight: 600; white-space: nowrap; }
  .st.worked { color: var(--good); }
  .st.didnot { color: var(--bad); }
  th button { all: unset; cursor: pointer; color: var(--accent); }
  th button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  th[aria-sort] button { color: var(--fg); }
  th .arrow { font-size: 10px; margin-left: 3px; }
  .sorthint { font-size: 12.5px; color: var(--muted); margin: 0 0 6px; }
</style>
</head>
<body>
<main>
  <h1>Improvement Testing</h1>
  <div class="how" id="how"></div>
  <p class="sorthint" id="hint" hidden>Sort by clicking a blue column heading. Each fix's label links to its row on
  Possible Improvements, where the fix is described in full.</p>
  <div class="tablewrap" id="wrap"></div>
</main>
<script src="assets/site.js?v=f80bffa-1794677900"></script>
<script>
(async () => {
  try {
    const meta = await M2.load("meta.json");
    M2.header(meta, "next_testing.html");
    let t = null, rep = null;
    try { t = await M2.load("testing.json"); } catch (e) { /* no possible fixes for this set */ }
    try { rep = await M2.load("improvements.json"); } catch (e) { /* none */ }
    const how = document.getElementById("how");
    if (!t) {
      how.innerHTML = `No possible improvements have been written for this world and forecast yet, so none has been tested.`;
      return;
    }
    how.innerHTML = `Every <a href="next_improvements.html">possible improvement</a>, and what became of it.
      ${t.planned_by ? `The fixes to test were chosen by a fixed rule: ${M2.esc(t.planned_by)}; the rest were not tried.` : ""}
      Each test was carried out by an AI agent that made the change and ran the checks its fix describes. <b>Order</b> is
      the fix's place in the testing plan. <b>Actual time to test</b> runs from the start of the test to its result, and
      <b>actual financial cost</b> is the cloud computing it used. These results have not been human-reviewed.`;
    const problems = rep ? rep.problems : {};
    const STATUS = ["Worked", "Partly worked", "Did not work", "Could not test", "Tested", "Planned", "Not tried"];
    const title = (s) => s.replace(/\b\w/g, (c) => c.toUpperCase());   // "Partly worked" -> "Partly Worked"
    const letter = (l) => l.replace(/^\d+/, "");
    const rows = t.fixes.map((f, i) => ({ ...f, i }));
    const last = (v, k) => (v == null ? Infinity : v);   // rows without a value sort after the rest
    const tie = (a, b) => a.problem - b.problem || letter(a.label).localeCompare(letter(b.label));
    const cols = {
      order: (a, b) => last(a.order) - last(b.order) || tie(a, b),
      fix: tie,
      problem: tie,
      status: (a, b) => STATUS.indexOf(a.status) - STATUS.indexOf(b.status) || last(a.order) - last(b.order) || tie(a, b),
      time: (a, b) => last(a.result?.runtime_hours) - last(b.result?.runtime_hours) || tie(a, b),
      cost: (a, b) => last(a.result?.cost_usd) - last(b.result?.cost_usd) || tie(a, b),
    };
    let key = cols[M2.param("sort")] ? M2.param("sort") : "order", dir = M2.param("dir") === "desc" ? -1 : 1;
    const head = (k, label, cls = "") => {
      const on = k === key;
      return `<th class="${cls}"${on ? ` aria-sort="${dir > 0 ? "ascending" : "descending"}"` : ""}><button type="button" data-k="${k}">${label}`
        + `<span class="arrow" aria-hidden="true">${on ? (dir > 0 ? "▲" : "▼") : "↕"}</span></button></th>`;
    };
    const dur = (h) => h == null ? "" : h < 1 ? `${Math.round(h * 60)} minutes` : `${h.toFixed(1)} hours`;
    const usd = (x) => x == null ? "" : `$${x.toFixed(2)}`;
    const stcls = (s) => s === "Worked" ? "worked" : s === "Did not work" ? "didnot" : "";
    const tested = rows.filter((f) => f.result);
    const hrs = tested.reduce((a, f) => a + f.result.runtime_hours, 0), cost = tested.reduce((a, f) => a + f.result.cost_usd, 0);
    const draw = () => {
      // rows with no value in the sorted column stay at the bottom whichever way the column is sorted
      const sorted = rows.slice().sort((a, b) => {
        const c = cols[key](a, b);
        const na = key === "order" ? a.order == null : key === "time" || key === "cost" ? !a.result : false;
        const nb = key === "order" ? b.order == null : key === "time" || key === "cost" ? !b.result : false;
        return na !== nb ? (na ? 1 : -1) : dir * c;
      });
      document.getElementById("wrap").innerHTML = `<table class="tests"><thead><tr>${head("order", "Order")}${head("fix", "Fix")}`
        + `${head("problem", "Problem")}<th>Fix Summary</th>${head("status", "Status")}${head("time", "Actual Time To Test", "n")}`
        + `${head("cost", "Actual Financial Cost", "n")}<th>What Happened</th></tr></thead><tbody>`
        + sorted.map((f) => `<tr id="fix-${f.label}" class="${f.order == null ? "untried" : ""}">`
          + `<td class="n">${f.order ?? ""}</td>`
          + `<td class="id"><a href="next_improvements.html#fix-${f.label}">${f.label}</a><span class="pid" title="The fix's lasting id: ${M2.esc(f.fix_id)}">${M2.esc(f.fix_id.slice(0, 8))}</span></td>`
          + `<td class="p"><a href="next_problems.html#problem-${f.problem}">${f.problem}. ${M2.esc(problems[f.problem] || "")}</a></td>`
          + `<td class="t">${M2.esc(f.title || "")}</td>`
          + `<td><span class="st ${stcls(f.status)}">${title(f.status)}</span>${f.tests > 1 ? `<span class="pid">latest of ${f.tests} tests</span>` : ""}</td>`
          + `<td class="n">${dur(f.result?.runtime_hours)}</td><td class="n">${usd(f.result?.cost_usd)}</td>`
          + `<td class="s">${M2.esc(f.result?.summary || "")}</td></tr>`).join("")
        + `</tbody><tfoot><tr><td colspan="5">${tested.length} of ${rows.length} fixes tested</td><td class="n">${dur(hrs)}</td>`
        + `<td class="n">${usd(cost)}</td><td></td></tr></tfoot></table>`;
      document.querySelectorAll("th button").forEach((b) => b.addEventListener("click", () => {
        if (b.dataset.k === key) dir = -dir; else { key = b.dataset.k; dir = 1; }
        const q = new URLSearchParams(location.search);
        q.set("sort", key);
        if (dir > 0) q.delete("dir"); else q.set("dir", "desc");
        history.replaceState(null, "", `?${q}${location.hash}`);
        draw();
        document.querySelector(`th button[data-k="${key}"]`).focus();
      }));
    };
    document.getElementById("hint").hidden = false;
    draw();
    const go = () => {   // a link to one fix (#fix-3B): mark and scroll to its row
      document.querySelectorAll("tr.hit").forEach((el) => el.classList.remove("hit"));
      const el = location.hash && document.getElementById(decodeURIComponent(location.hash.slice(1)));
      if (el) { el.classList.add("hit"); el.scrollIntoView(); }
    };
    go();
    addEventListener("hashchange", go);
  } catch (e) { M2.fail(e); }
})();
</script>
</body>
</html>
