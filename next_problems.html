<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Current Problems · Model 2 (dev)</title>
<link rel="stylesheet" href="assets/site.css?v=6ffbc77-1794676418">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=Source+Code+Pro:wght@400;500&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;600;700;800&display=swap">
<style>
  main > p, main > ol { max-width: 80ch; }
  .how { background: var(--band2); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; max-width: 900px; font-size: 13.5px; }
  .toc { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; margin: 10px 0 6px; }
  .toc[hidden] { display: none; }
  table.rep { font-size: 12.5px; }
  table.rep td { vertical-align: top; }
  table.rep td:first-child { color: var(--muted); }
  table.rep th { vertical-align: bottom; white-space: normal; }
  table.rep td { min-width: 3.5em; }
  table.rep td:nth-child(2) { min-width: 6em; }
  /* the headings stay in view below the site header while the table's rows do; that needs the table outside a
     sideways-scrolling box, so on narrow screens (where it must scroll sideways) they scroll away */
  @media (min-width: 900px) {
    #report .tablewrap { overflow: visible; }
    table.rep thead th { position: sticky; top: calc(var(--hdr, 43px) + var(--sub, 0px)); z-index: 2; background: var(--bg); box-shadow: inset 0 -1px 0 var(--line); }
  }
  /* (i) after a heading: its definition shows on hover or keyboard focus */
  .def { position: relative; display: inline-grid; place-items: center; width: 14px; height: 14px; margin-left: 2px; border-radius: 50%;
    border: 1px solid var(--muted); color: var(--muted); font: italic 600 10px/1 Georgia, serif; cursor: help; vertical-align: 1px; }
  .def:hover, .def:focus-visible { color: var(--accent); border-color: var(--accent); outline: none; }
  .def::after { content: attr(data-def); position: absolute; top: calc(100% + 6px); left: -8px; z-index: 5; width: 260px;
    padding: 8px 10px; background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 6px;
    box-shadow: 0 4px 14px rgba(0,0,0,.12); font: 400 12.5px/1.45 "Source Sans 3", system-ui, sans-serif; text-align: left;
    white-space: normal; text-transform: none; letter-spacing: 0; visibility: hidden; opacity: 0; transition: opacity .12s; }
  .def:hover::after, .def:focus-visible::after { visibility: visible; opacity: 1; }
  table.rep th:nth-last-child(-n+3) .def::after { left: auto; right: -8px; }
  .prob { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 16px; margin: 10px 0; max-width: 980px; }
  .prob h3 { margin: 0 0 6px; font-size: 15.5px; }
  .prob .pid { font-weight: 600; font-family: "IBM Plex Mono", ui-monospace, monospace; }
  .prob:target, .prob.hit { border-color: var(--accent); box-shadow: 0 0 0 2px var(--band); }
  .prob { scroll-margin-top: calc(var(--hdr, 48px) + var(--sub, 44px) + 12px); }
  .prob .row { display: grid; grid-template-columns: 130px 1fr; gap: 4px 14px; font-size: 13.5px; margin: 4px 0; }
  .prob .row > span:first-child { color: var(--muted); font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.05em; padding-top: 2px; }
  @media (max-width: 760px) { .prob .row { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <h1>Current Problems</h1>
  <div class="how" id="how"></div>
  <nav class="toc" id="toc" aria-label="On this page" hidden><a href="#sectors">Weakest sectors</a><a href="#quantities">Weakest hidden quantities</a><a href="#problems">Problems</a></nav>
  <div id="report"></div>
</main>
<script src="assets/site.js?v=6ffbc77-1794676418"></script>
<script>
(async () => {
  try {
    const meta = await M2.load("meta.json");
    M2.header(meta, "next_problems.html");
    const [idx, sid] = [await M2.sets(), await M2.currentSet()];
    const set = idx.sets.find((x) => x.id === sid) || {};
    const which = `the world ${M2.esc(set.world || "shown")} and its forecast for ${M2.esc(set.as_of || meta.as_of)}`;
    let rep = null;
    try { rep = await M2.load("problems.json"); } catch (e) { /* no summary for this set */ }
    const how = document.getElementById("how");
    if (!rep) {
      how.innerHTML = `No problem summary has been written for this world and forecast yet (${which}). Choose another
        world and forecast at the top right to see one that has a summary.`;
      return;
    }
    how.innerHTML = `This analysis was written by an AI evaluator that saw only the
      <a href="eval_revisions.html">Evaluation pages</a> that need no ground truth. It had no access to the true values,
      the model's code, or how the model was developed. This analysis has not been human-reviewed.`;
    document.getElementById("report").innerHTML = rep.html;
    document.getElementById("toc").hidden = false;
    const go = () => {   // the report arrives after load, so mark and scroll to the linked problem here
      document.querySelectorAll(".prob.hit").forEach((el) => el.classList.remove("hit"));
      const el = location.hash && document.getElementById(decodeURIComponent(location.hash.slice(1)));
      if (el) { el.classList.add("hit"); el.scrollIntoView(); }
    };
    go();
    addEventListener("hashchange", go);
  } catch (e) { M2.fail(e); }
})();
</script>
</body>
</html>
