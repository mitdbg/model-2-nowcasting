<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Current Problems · Model 2 (dev)</title>
<link rel="stylesheet" href="assets/site.css?v=ae6cb95-1794596311">
<style>
  main > p, main > ol { max-width: 80ch; }
  .how { background: var(--band2); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; max-width: 900px; font-size: 13.5px; }
  .toc { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; margin: 10px 0 6px; }
  .toc[hidden] { display: none; }
  table.rep { font-size: 12.5px; }
  table.rep td { vertical-align: top; }
  table.rep td:first-child { color: var(--muted); }
  .prob { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 16px; margin: 10px 0; max-width: 980px; }
  .prob h3 { margin: 0 0 6px; font-size: 15.5px; }
  .prob h3 .pid { margin-left: 8px; font-weight: 400; font-size: 11.5px; color: var(--muted); font-family: "IBM Plex Mono", ui-monospace, monospace; }
  .prob:target, .prob.hit { border-color: var(--accent); box-shadow: 0 0 0 2px var(--band); }
  .prob { scroll-margin-top: calc(var(--hdr, 48px) + var(--sub, 44px) + 12px); }
  .prob .row { display: grid; grid-template-columns: 130px 1fr; gap: 4px 14px; font-size: 13.5px; margin: 4px 0; }
  .prob .row > span:first-child { color: var(--muted); font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.05em; padding-top: 2px; }
  @media (max-width: 760px) { .prob .row { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <h1>Current Problems</h1>
  <div class="how" id="how"></div>
  <nav class="toc" id="toc" aria-label="On this page" hidden><a href="#sectors">Weakest sectors</a><a href="#quantities">Weakest hidden quantities</a><a href="#problems">Problems</a></nav>
  <div id="report"></div>
</main>
<script src="assets/site.js?v=ae6cb95-1794596311"></script>
<script>
(async () => {
  try {
    const meta = await M2.load("meta.json");
    M2.header(meta, "next_problems.html");
    const [idx, sid] = [await M2.sets(), await M2.currentSet()];
    const set = idx.sets.find((x) => x.id === sid) || {};
    const which = `the world ${M2.esc(set.world || "shown")} and its forecast for ${M2.esc(set.as_of || meta.as_of)}`;
    let rep = null;
    try { rep = await M2.load("problems.json"); } catch (e) { /* no summary for this set */ }
    const how = document.getElementById("how");
    if (!rep) {
      how.innerHTML = `No problem summary has been written for this world and forecast yet (${which}). Choose another
        world and forecast at the top right to see one that has a summary.`;
      return;
    }
    how.innerHTML = `How this page was written: by an evaluator that saw only what a reader of this site sees on the
      four <a href="eval_revisions.html">Evaluation</a> pages that need no ground truth (Forecasts against later estimates,
      Observations against the model, Sector totals against official statistics, What the data pin down), for ${which}.
      It knew nothing of the true values, the model's code or how it was developed, and was asked to describe problems,
      not to propose fixes. Its causes are hypotheses. Proposed fixes belong on
      <a href="next_improvements.html">Possible Improvements</a>.`;
    document.getElementById("report").innerHTML = rep.html;
    document.getElementById("toc").hidden = false;
    const go = () => {   // the report arrives after load, so mark and scroll to the linked problem here
      document.querySelectorAll(".prob.hit").forEach((el) => el.classList.remove("hit"));
      const el = location.hash && document.getElementById(decodeURIComponent(location.hash.slice(1)));
      if (el) { el.classList.add("hit"); el.scrollIntoView(); }
    };
    go();
    addEventListener("hashchange", go);
  } catch (e) { M2.fail(e); }
})();
</script>
</body>
</html>
