<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Testing Plan · Model 2 (dev)</title>
<link rel="stylesheet" href="assets/site.css?v=dfdeaed-1794654087">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=Source+Code+Pro:wght@400;500&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;600;700;800&display=swap">
<style>
  main > p { max-width: 80ch; }
  .how { background: var(--band2); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; max-width: 900px; font-size: 13.5px; margin-bottom: 14px; }
  table.tests { font-size: 13px; max-width: 1200px; }
  @media (min-width: 900px) {
    #wrap.tablewrap { overflow: visible; }
    table.tests thead th { position: sticky; top: var(--hdr, 43px); z-index: 2; background: var(--bg); box-shadow: inset 0 -1px 0 var(--line); }
  }
  table.tests td.id { font-weight: 600; white-space: nowrap; }
  .pid { display: block; font-weight: 400; font-size: 11px; color: var(--muted); font-family: "IBM Plex Mono", ui-monospace, monospace; }
  table.tests td.p { width: 20%; }
  table.tests td.f { width: 40%; }
  table.tests td.n { white-space: nowrap; }
  table.tests tfoot td { font-weight: 600; border-top: 1px solid var(--fg); }
</style>
</head>
<body>
<main>
  <h1>Testing Plan</h1>
  <div class="how" id="how"></div>
  <div class="tablewrap" id="wrap"></div>
</main>
<script src="assets/site.js?v=dfdeaed-1794654087"></script>
<script>
(async () => {
  try {
    const meta = await M2.load("meta.json");
    M2.header(meta, "next_plan.html");
    const [idx, sid] = [await M2.sets(), await M2.currentSet()];
    const set = idx.sets.find((x) => x.id === sid) || {};
    const which = `the world ${M2.esc(set.world || "shown")} and its forecast for ${M2.esc(set.as_of || meta.as_of)}`;
    let plan = null, rep = null;
    try { plan = await M2.load("testplan.json"); } catch (e) { /* nothing planned for this set */ }
    try { rep = await M2.load("improvements.json"); } catch (e) { /* no possible fixes */ }
    const how = document.getElementById("how");
    if (!plan) {
      how.innerHTML = `No fixes are planned for testing for ${which} yet. The plan will list the
        <a href="next_improvements.html">possible improvements</a> chosen to be tested, in the order they will be tested.`;
      return;
    }
    how.innerHTML = `The <a href="next_improvements.html">possible improvements</a> chosen to be tested for ${which}, in
      the order they will be tested. Each test makes the change and runs the checks its fix describes; what each found
      is under <a href="next_results.html">Test Results</a>. The likelihood, time and cost are the estimates made when
      the fix was written. Each planned test has its own lasting id (point at one for the whole id).`;
    const L = rep ? rep.likelihood : [];
    const title = (n) => rep ? rep.problems[n] : "";
    const rows = plan.items;
    const hrs = rows.reduce((a, f) => a + (f.time_hours || 0), 0), usd = rows.reduce((a, f) => a + (f.cost_usd || 0), 0);
    document.getElementById("wrap").innerHTML = `<table class="tests"><thead><tr><th>Order</th><th>Fix</th><th>Problem</th>`
      + `<th>Possible Fix</th><th>Likelihood of Success</th><th>Estimated Time To Test</th><th>Estimated Financial Cost To Test</th><th>Status</th></tr></thead><tbody>`
      + rows.map((f) => `<tr><td class="id">${f.order}<span class="pid" title="This planned test's lasting id: ${M2.esc(f.id)}">${M2.esc(f.id.slice(0, 8))}</span></td>`
        + `<td class="id"><a href="next_improvements.html#fix-${f.label}">${f.label}</a><span class="pid" title="The fix's lasting id: ${M2.esc(f.fix_id)}">${M2.esc(f.fix_id.slice(0, 8))}</span></td>`
        + `<td class="p"><a href="next_problems.html#problem-${f.problem}">${f.problem}. ${M2.esc(title(f.problem))}</a></td>`
        + `<td class="f">${M2.esc(f.fix)}</td><td class="n">${M2.esc(f.likelihood)}</td><td class="n">${M2.esc(f.time)}</td><td class="n">${M2.esc(f.cost)}</td>`
        + `<td class="n">${f.results.length ? `<a href="next_results.html#result-${f.results[f.results.length - 1]}">Tested${f.results.length > 1 ? ` (${f.results.length} times)` : ""}</a>` : "Planned"}</td></tr>`).join("")
      + `</tbody><tfoot><tr><td colspan="5">${rows.length === 1 ? "1 planned test" : `All ${rows.length} planned tests`}</td><td class="n">about ${Math.round(hrs)} hours</td>`
      + `<td class="n">about $${Math.round(usd)}</td><td>${rows.filter((f) => f.results.length).length} tested</td></tr></tfoot></table>`;
  } catch (e) { M2.fail(e); }
})();
</script>
</body>
</html>
