<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entities · Model 2 (dev)</title>
<link rel="stylesheet" href="assets/site.css?v=61de395-1794502689">
<style>
  .every .side { height: calc(100vh - 330px); min-height: 420px; max-height: none; overflow: hidden;
    display: flex; flex-direction: column; }
  .every .side > * { flex: none; }
  .every #list { flex: 1 1 0; min-height: 0; overflow-y: auto; border-top: 1px solid var(--line); padding-top: 4px; }
  .filters { display: grid; grid-template-columns: auto 1fr; gap: 4px 6px; margin: 8px 0 4px; font-size: 12px; color: var(--muted); }
  .filters label { display: contents; }
  .filters select { font-size: 12px; padding: 2px 4px; min-width: 0; }
  .fcount { font-size: 12px; color: var(--muted); margin: 2px 0 6px; display: flex; justify-content: space-between; }
  .linkbtn { font: inherit; border: none; background: none; color: var(--accent); cursor: pointer; padding: 0; }
  .dkv { display: grid; grid-template-columns: 120px 1fr; gap: 8px 14px; align-items: baseline; max-width: 820px; }
  .dk { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; }
  .dv { min-width: 0; }
  .gk { display: grid; grid-template-columns: 90px 1fr; gap: 6px 10px; align-items: baseline; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px 6px; }
  .vchip { font: inherit; font-size: 13px; padding: 1px 9px; border: 1px solid var(--line); border-radius: 12px;
    background: var(--panel); color: var(--fg); cursor: pointer; }
  .vchip:hover { border-color: var(--accent); }
  .vchip.static { cursor: default; }
  .vchip.static:hover { border-color: var(--line); }
  .every #detail { max-height: calc(100vh - 330px); min-height: 260px; overflow: auto; }
  #bysector td, #bysector th, #kinds td, #kinds th { padding-top: 3px; padding-bottom: 3px; }
  @media (max-width: 760px) { .every #detail { max-height: none; } .every .side { height: 480px; } }
</style>
</head>
<body>
<main>
  <h1>Entities</h1>
  <p class="sub" id="intro"></p>

  <div class="tabs" id="views" role="tablist" aria-label="View">
    <button type="button" role="tab" data-v="sector">By sector</button>
    <button type="button" role="tab" data-v="groupings">Groupings</button>
    <button type="button" role="tab" data-v="every">Every entity</button>
  </div>

  <section data-v="sector">
  <div class="tablewrap"><table id="bysector"></table></div>
  </section>

  <section data-v="groupings" hidden>
  <p class="sub">Observations are about an entity or a grouping of entities. The model predicts an observation about
  a grouping from the grouping's members on the observation's date, each at its weight.</p>
  <div class="tablewrap"><table id="kinds"></table></div>
  </section>

  <section data-v="every" hidden>
  <div class="layout every">
    <aside class="side">
      <input type="search" id="q" placeholder="Name contains…" aria-label="Name contains">
      <div class="filters" id="filters">
        <label>Sector <select data-f="sector"></select></label>
        <label>Kind <select data-f="kind"></select></label>
        <label>Size <select data-f="size"></select></label>
        <label>Region <select data-f="region"></select></label>
        <label>Grouping <select data-f="grouping"></select></label>
        <label>Observation <select data-f="obs"></select></label>
      </div>
      <div class="fcount"><span id="count"></span> <button type="button" id="clear" class="linkbtn">Clear</button></div>
      <div id="list"></div>
    </aside>
    <div id="detail"></div>
  </div>
  </section>
</main>
<script src="assets/site.js?v=61de395-1794502689"></script>
<script>
(async () => {
  try {
    const [meta, ents, gs] = await Promise.all([M2.load("meta.json"), M2.load("entities.json"), M2.load("groupings.json")]);
    M2.header(meta, "world_entities.html");
    const sec = Object.fromEntries(meta.sectors.map((s) => [s.code, s]));
    const tracked = ents.filter((e) => e.kind === "tracked"), reps = ents.filter((e) => e.kind === "representative");
    const est = reps.reduce((a, e) => a + (e.n_establishments || 0), 0);
    const companies = new Set(tracked.map((e) => e.operator).filter(Boolean));
    document.getElementById("intro").innerHTML = `The world has ${ents.length} entities in ${meta.sectors.length} sectors.
      <b>${tracked.length} tracked entities</b> are specific sites or networks, run by ${companies.size} companies, each with
      observations of its own. <b>${reps.length} representative entities</b> stand for the other ${est.toLocaleString()}
      establishments, one for each sector, size class and region, sized by the Census establishment counts. This page
      lists what the world contains; the <a href="entity.html">Entities</a> tab shows what the model estimates for each.`;

    const UNIT = { usd_2017: "2017 dollars", boe: "barrel of oil equivalent", MW: "megawatt" };
    const rows = meta.sectors.map((s) => {
      const t = tracked.filter((e) => e.sector === s.code), r = reps.filter((e) => e.sector === s.code);
      return `<tr><td>${M2.esc(s.short)}</td><td class="muted">${M2.esc(s.label)}</td><td class="n">${t.length}</td><td class="n">${r.length}</td>
        <td class="n">${r.reduce((a, e) => a + (e.n_establishments || 0), 0).toLocaleString()}</td>
        <td class="n">${new Set(t.map((e) => e.operator).filter(Boolean)).size}</td><td>${M2.esc(UNIT[s.unit] || s.unit.replace(/_/g, "-"))}</td></tr>`;
    }).join("");
    document.getElementById("bysector").innerHTML = `<tr><th>Sector</th><th></th><th class="n">Tracked</th><th class="n">Representative</th>
      <th class="n">Establishments represented</th><th class="n">Companies</th><th>Unit of output</th></tr>${rows}`;

    document.getElementById("kinds").innerHTML = `<tr><th>Kind</th><th class="n">Groupings</th><th>Members</th></tr>` +
      Object.entries(M2.GROUPING_KINDS).map(([k, [label, rule]]) => {
        const n = gs.filter((g) => g.kind === k).length;
        return n ? `<tr><td>${label}</td><td class="n">${n}</td><td>${M2.esc(rule)}</td></tr>` : "";
      }).join("");

    // every grouping each entity belongs to
    const member = {};
    gs.forEach((g) => g.members.forEach((m) => (member[m.id] ||= []).push({ g, m })));
    const KIND = (k) => M2.GROUPING_KINDS[k]?.[0] || k;
    let sel = ents.some((x) => x.id === M2.param("e")) ? M2.param("e") : tracked[0].id;
    // filters: every choice narrows the list; the grouping choices follow the chosen sector
    const F = { sector: "", kind: "", size: "", region: "", grouping: "", obs: "" };
    Object.keys(F).forEach((k) => { F[k] = M2.param(k) || ""; });   // filters can come in the address
    const sel_ = (f) => document.querySelector(`#filters select[data-f="${f}"]`);
    const opts = (f, pairs) => {
      const cur = F[f];
      sel_(f).innerHTML = `<option value="">all</option>` + pairs;
      sel_(f).value = cur;
      if (sel_(f).value !== cur) F[f] = "";
    };
    const uniq = (k) => [...new Set(ents.map((e) => e[k]).filter(Boolean))];
    const ORDER = { small: 0, medium: 1, large: 2 };
    const gById = Object.fromEntries(gs.map((g) => [g.id, g]));
    const fillOptions = () => {
      opts("sector", meta.sectors.map((s) => `<option value="${s.code}">${M2.esc(s.short)}</option>`).join(""));
      opts("kind", ["tracked", "representative"].map((k) => `<option>${k}</option>`).join(""));
      opts("size", uniq("size").sort((a, b) => (ORDER[a] ?? 9) - (ORDER[b] ?? 9)).map((k) => `<option>${k}</option>`).join(""));
      opts("region", uniq("region").sort().map((k) => `<option>${k}</option>`).join(""));
      opts("grouping", ["company", "segment", "site", "census_cell"].map((k) => {
        const xs = gs.filter((g) => g.kind === k && (!F.sector || (g.sector || []).includes(F.sector))).sort((a, b) => a.name.localeCompare(b.name));
        return xs.length ? `<optgroup label="${KIND(k)}">${xs.map((g) => `<option value="${M2.esc(g.id)}">${M2.esc(g.name)}</option>`).join("")}</optgroup>` : "";
      }).join(""));
      const ot = [...new Set(ents.flatMap((e) => e.obs_types || []))].map((t) => [t, M2.OBS[t]?.[0] || t]).sort((a, b) => a[1].localeCompare(b[1]));
      opts("obs", ot.map(([t, l]) => `<option value="${t}">${M2.esc(l)}</option>`).join(""));
    };
    const keep = (e) => {
      const q = document.getElementById("q").value.toLowerCase();
      return (e.name + e.id).toLowerCase().includes(q) && (!F.sector || e.sector === F.sector) && (!F.kind || e.kind === F.kind)
        && (!F.size || e.size === F.size) && (!F.region || e.region === F.region)
        && (!F.grouping || (gById[F.grouping]?.members || []).some((m) => m.id === e.id))
        && (!F.obs || (e.obs_types || []).includes(F.obs));
    };
    const renderList = () => {
      const shown = ents.filter(keep);
      document.getElementById("count").textContent = `${shown.length} of ${ents.length} entities`;
      // in display order: by sector, tracked before representative, then by name
      const groups = meta.sectors.map((s) => [s, shown.filter((e) => e.sector === s.code)
        .sort((a, b) => (a.kind === b.kind ? a.name.localeCompare(b.name) : a.kind === "tracked" ? -1 : 1))]);
      const ordered = groups.flatMap(([, xs]) => xs);
      // the selection always comes from the list as filtered: if the filters leave it out, take the first shown
      const moved = ordered.length > 0 && !ordered.some((e) => e.id === sel);
      if (moved) sel = ordered[0].id;
      document.getElementById("list").innerHTML = groups.map(([s, xs]) => xs.length ? `<div class="grp">${M2.esc(s.short)}</div>` + xs.map((e) =>
        `<a href="?v=every&e=${encodeURIComponent(e.id)}" data-e="${M2.esc(e.id)}" class="${e.id === sel ? "on" : ""}">${M2.esc(e.name)}</a>`).join("") : "").join("");
      document.querySelector("#list a.on")?.scrollIntoView({ block: "nearest" });
      if (!ordered.length) document.getElementById("detail").innerHTML = `<p class="muted">No entity matches these filters.</p>`;
      else if (moved) { renderDetail(); url(); }
    };
    // the selected entity, in the filters' order; every value applies that filter to the list
    const counts = {};
    const filterTo = (k, v) => { Object.keys(F).forEach((x) => { F[x] = ""; }); document.getElementById("q").value = ""; F[k] = v; fillOptions(); renderList(); url(); };
    const vbtn = (k, v, label, extra = "") => `<button type="button" class="vchip" data-k="${k}" data-v="${M2.esc(v)}"${extra}>${label}</button>`;
    const renderDetail = async () => {
      const e = ents.find((x) => x.id === sel) || tracked[0], s = sec[e.sector] || {}, id = e.id;
      const ms = member[e.id] || [];
      const byKind = ["company", "segment", "site", "census_cell", "sector", "region", "custom"].map((k) => [k, ms.filter((x) => x.g.kind === k)]).filter(([, xs]) => xs.length);
      const company = gs.find((g) => g.kind === "company" && g.name === e.operator);
      const kindNote = e.kind === "tracked" ? "a specific site or network with observations of its own"
        : `stands for ${(e.n_establishments || 0).toLocaleString()} establishments in its sector, size class and region`;
      const row = (k, v) => `<span class="dk">${k}</span><span class="dv">${v}</span>`;
      const obsRow = () => {
        const c = counts[id], types = e.obs_types || [];
        const n = (t) => (c ? c[t] || 0 : null);
        const xs = types.map((t) => [t, M2.OBS[t]?.[0] || t, n(t)]).sort((a, b) => (b[2] ?? 0) - (a[2] ?? 0) || a[1].localeCompare(b[1]));
        return `<div class="muted" style="margin-bottom:4px">${(e.n_obs || 0).toLocaleString()} in total, ${types.length} kinds;
          <a href="world_observations.html?v=every&entity=${encodeURIComponent(id)}">browse them</a> ·
          <a href="world_observations.html?v=kinds">about each kind</a></div>
          <div class="chips">${xs.map(([t, l, k]) => vbtn("obs", t, `${M2.esc(l)}${k != null ? ` <span class="muted">${k}</span>` : ""}`)).join("") || '<span class="muted">none</span>'}</div>`;
      };
      const draw = () => {
        if (id !== sel) return;
        document.getElementById("detail").innerHTML = `
          <h3 style="font-size:18px;margin:0 0 10px">${M2.esc(e.name)}</h3>
          <div class="dkv">
            ${row("Sector", `${vbtn("sector", e.sector, M2.esc(s.short))} <span class="muted">${M2.esc(s.label)}</span>`)}
            ${row("Kind", `${vbtn("kind", e.kind, e.kind)} <span class="muted">${kindNote}</span>`)}
            ${row("Size", vbtn("size", e.size, e.size))}
            ${row("Region", vbtn("region", e.region, e.region))}
            ${e.operator ? row("Run by", company ? vbtn("grouping", company.id, M2.esc(e.operator)) : M2.esc(e.operator)) : ""}
            ${row("Establishments", (e.n_establishments || 1).toLocaleString())}
            ${row("Groupings", `<div class="gk">${byKind.map(([k, xs]) => `<span class="muted">${KIND(k)}</span><div class="chips">${xs.map(({ g, m }) =>
                ["company", "segment", "site", "census_cell"].includes(k)
                  ? vbtn("grouping", g.id, `${M2.esc(g.name)}${m.weight != null && +m.weight !== 1 ? ` <span class="muted">× ${(+m.weight).toFixed(2)}</span>` : ""}`, ` title="${m.first || ""} to ${m.last || ""}"`)
                  : `<span class="vchip static">${M2.esc(g.name)}</span>`).join("")}</div>`).join("")}</div>`)}
            ${row("Observations", obsRow())}
          </div>`;
      };
      draw();
      if (!counts[id]) {
        try {
          const d = await M2.load(`entities/${encodeURIComponent(id)}.json`);
          counts[id] = Object.fromEntries(Object.entries(d.observations || {}).map(([t, o]) => [t, (o.month || []).length]));
        } catch (err) { counts[id] = {}; }
        draw();
      }
    };
    document.getElementById("detail").addEventListener("click", (ev) => {
      const b = ev.target.closest("button.vchip[data-k]");
      if (b) filterTo(b.dataset.k, b.dataset.v);
    });
    const VIEWS = ["sector", "groupings", "every"];
    let view = VIEWS.includes(M2.param("v")) ? M2.param("v") : M2.param("e") ? "every" : "sector";
    const url = () => {
      const p = new URLSearchParams({ v: view });
      if (view === "every") { p.set("e", sel); Object.entries(F).forEach(([k, v]) => v && p.set(k, v)); }
      history.replaceState(null, "", `?${p}`);
    };
    const showView = () => {
      document.querySelectorAll("#views button").forEach((b) => {
        b.classList.toggle("on", b.dataset.v === view); b.setAttribute("aria-selected", b.dataset.v === view); });
      document.querySelectorAll("main section[data-v]").forEach((x) => { x.hidden = x.dataset.v !== view; });
    };
    document.getElementById("views").addEventListener("click", (ev) => {
      const b = ev.target.closest("button[data-v]");
      if (!b) return;
      view = b.dataset.v; showView(); url();
    });
    showView();
    document.getElementById("q").addEventListener("input", renderList);
    document.getElementById("filters").addEventListener("change", (ev) => {
      const f = ev.target.dataset.f;
      if (!f) return;
      F[f] = ev.target.value;
      if (f === "sector") fillOptions();
      renderList(); url();
    });
    document.getElementById("clear").addEventListener("click", () => {
      Object.keys(F).forEach((k) => { F[k] = ""; });
      document.getElementById("q").value = "";
      fillOptions(); renderList(); url();
    });
    fillOptions();
    document.getElementById("list").addEventListener("click", (ev) => {
      const a = ev.target.closest("a[data-e]");
      if (!a) return;
      ev.preventDefault();
      sel = a.dataset.e;
      url();
      renderList(); renderDetail();
    });
    renderList(); renderDetail();
  } catch (e) { M2.fail(e); }
})();
</script>
</body>
</html>
