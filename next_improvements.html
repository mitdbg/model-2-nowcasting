<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Possible Improvements · Model 2 (dev)</title>
<link rel="stylesheet" href="assets/site.css?v=da1a85f-1794678998">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=Source+Code+Pro:wght@400;500&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;600;700;800&display=swap">
<style>
  main > p { max-width: 80ch; }
  .how { background: var(--band2); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; max-width: 900px; font-size: 13.5px; margin-bottom: 14px; }
  table.fixes { font-size: 13px; max-width: 1200px; }
  /* the column headings stay in view below the site header while rows remain; that needs the table
     outside a sideways-scrolling box, so on narrow screens (where it must scroll sideways) they scroll away */
  @media (min-width: 900px) {
    #wrap.tablewrap { overflow: visible; }
    table.fixes thead th { position: sticky; top: calc(var(--hdr, 43px) + var(--sub, 0px)); z-index: 2; background: var(--bg);
      box-shadow: inset 0 -1px 0 var(--line); }
    table.fixes tr { scroll-margin-top: calc(var(--hdr, 43px) + var(--sub, 0px) + 44px); }
  }
  table.fixes td.id { font-weight: 600; white-space: nowrap; }
  .pid { display: block; font-weight: 400; font-size: 11px; color: var(--muted); font-family: "IBM Plex Mono", ui-monospace, monospace; }
  table.fixes tr { scroll-margin-top: calc(var(--hdr, 48px) + var(--sub, 0px) + 12px); }
  table.fixes tr:target, table.fixes tr.hit { background: var(--band2); }
  table.fixes td.p { width: 21%; }
  table.fixes td.f { width: 46%; }
  table.fixes td.n { white-space: nowrap; }
  table.fixes tr.cont td.p a { color: var(--muted); }
  th button[data-k] { all: unset; cursor: pointer; color: var(--accent); }
  th button[data-k]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  th[aria-sort] button[data-k] { color: var(--fg); }
  th .arrow { font-size: 10px; margin-left: 3px; }
  .lk { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .lk .dots { display: inline-flex; gap: 2px; }
  .lk .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--grid); border: 1px solid var(--line); }
  .lk .dots i.on { background: var(--accent); border-color: var(--accent); }
  .sorthint { font-size: 12.5px; color: var(--muted); margin: 0 0 6px; }
</style>
</head>
<body>
<main>
  <h1>Possible Improvements</h1>
  <div class="how" id="how"></div>
  <div class="tablewrap ai" id="wrap" data-ai="AI generated"></div>
</main>
<script src="assets/site.js?v=da1a85f-1794678998"></script>
<script>
(async () => {
  try {
    const meta = await M2.load("meta.json");
    M2.header(meta, "next_improvements.html");
    const [idx, sid] = [await M2.sets(), await M2.currentSet()];
    const set = idx.sets.find((x) => x.id === sid) || {};
    const which = `the world ${M2.esc(set.world || "shown")} and its forecast for ${M2.esc(set.as_of || meta.as_of)}`;
    let rep = null;
    try { rep = await M2.load("improvements.json"); } catch (e) { /* none for this set */ }
    const how = document.getElementById("how");
    if (!rep) {
      how.innerHTML = `No possible improvements have been written for this world and forecast yet (${which}).`;
      return;
    }
    how.innerHTML = `These proposed improvements were written by an AI evaluator that consumed the Current Problems
      analysis. These proposals have not been human-reviewed.`;
    const L = rep.likelihood;
    const rows = rep.fixes.map((f, i) => ({ ...f, order: i }));
    const cols = { problem: (a, b) => a.problem - b.problem || a.order - b.order,
                   likelihood: (a, b) => L.indexOf(a.likelihood) - L.indexOf(b.likelihood) || a.problem - b.problem || a.order - b.order,
                   time: (a, b) => a.time_hours - b.time_hours || a.problem - b.problem || a.order - b.order,
                   cost: (a, b) => a.cost_usd - b.cost_usd || a.problem - b.problem || a.order - b.order };
    let key = cols[M2.param("sort")] ? M2.param("sort") : "problem", dir = M2.param("dir") === "desc" ? -1 : 1;
    const head = (k, label, tip = "") => {
      const on = k === key;
      return `<th${on ? ` aria-sort="${dir > 0 ? "ascending" : "descending"}"` : ""}><button type="button" data-k="${k}">${label}`
        + `<span class="arrow" aria-hidden="true">${on ? (dir > 0 ? "▲" : "▼") : "↕"}</span></button>${M2.info(tip)}</th>`;
    };
    const lk = (v) => {
      const n = L.length - L.indexOf(v);
      return `<span class="lk" title="${M2.esc(v)}"><span class="dots" aria-hidden="true">`
        + L.map((_, j) => `<i class="${j < n ? "on" : ""}"></i>`).join("") + `</span>${M2.esc(v)}</span>`;
    };
    const draw = () => {
      const sorted = rows.slice().sort((a, b) => dir * cols[key](a, b));
      let last = null;
      document.getElementById("wrap").innerHTML = `<table class="fixes"><thead><tr><th>Fix</th>${head("problem", "Problem")}<th>Possible Fix</th>`
        + `${head("likelihood", "Likelihood of Success", "The reviewer's judgment of whether the fix would clearly reduce the problem, as the Evaluation pages show it.")}`
        + `${head("time", "Estimated Time To Test", "From starting work on the fix to having the test's result: writing the change and running the checks.")}`
        + `${head("cost", "Estimated Financial Cost To Test", "The cloud computing the checks would use.")}</tr></thead><tbody>`
        + sorted.map((f) => {
          const cont = key === "problem" && f.problem === last;   // later fixes for the same problem: link muted
          last = f.problem;
          return `<tr id="fix-${f.label}" class="${cont ? "cont" : ""}"><td class="id">${f.label}<span class="pid" title="This fix's lasting id: ${M2.esc(f.id)}">${M2.esc(f.id.slice(0, 8))}</span></td>`
            + `<td class="p"><a href="next_problems.html#problem-${f.problem}">${f.problem}. ${M2.esc(rep.problems[f.problem])}</a>`
            + `<span class="pid" title="The problem's lasting id: ${M2.esc(f.problem_id)}">${M2.esc(f.problem_id.slice(0, 8))}</span></td>`
            + `<td class="f">${M2.esc(f.fix)}</td><td>${lk(f.likelihood)}</td><td class="n">${M2.esc(f.time)}</td><td class="n">${M2.esc(f.cost)}</td></tr>`;
        }).join("") + "</tbody></table>";
      document.querySelectorAll("th button[data-k]").forEach((b) => b.addEventListener("click", () => {
        if (b.dataset.k === key) dir = -dir; else { key = b.dataset.k; dir = 1; }
        const q = new URLSearchParams(location.search);
        q.set("sort", key);
        if (dir > 0) q.delete("dir"); else q.set("dir", "desc");
        history.replaceState(null, "", `?${q}`);
        draw();
        document.querySelector(`th button[data-k="${key}"]`).focus();
      }));
    };
    draw();
    const go = () => {   // a link to one fix (#fix-3B): mark and scroll to its row
      document.querySelectorAll("tr.hit").forEach((el) => el.classList.remove("hit"));
      const el = location.hash && document.getElementById(decodeURIComponent(location.hash.slice(1)));
      if (el) { el.classList.add("hit"); el.scrollIntoView(); }
    };
    go();
    addEventListener("hashchange", go);
  } catch (e) { M2.fail(e); }
})();
</script>
</body>
</html>
