<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test Results · Model 2 (dev)</title>
<link rel="stylesheet" href="assets/site.css?v=4af39a6-1794675964">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=Source+Code+Pro:wght@400;500&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;600;700;800&display=swap">
<style>
  main > p { max-width: 80ch; }
  .how { background: var(--band2); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; max-width: 900px; font-size: 13.5px; margin-bottom: 14px; }
  table.tests { font-size: 13px; max-width: 1200px; }
  @media (min-width: 900px) {
    #wrap.tablewrap { overflow: visible; }
    table.tests thead th { position: sticky; top: calc(var(--hdr, 43px) + var(--sub, 0px)); z-index: 2; background: var(--bg); box-shadow: inset 0 -1px 0 var(--line); }
  }
  table.tests td.id { font-weight: 600; white-space: nowrap; }
  .pid { display: block; font-weight: 400; font-size: 11px; color: var(--muted); font-family: "IBM Plex Mono", ui-monospace, monospace; }
  table.tests tr { scroll-margin-top: calc(var(--hdr, 48px) + var(--sub, 0px) + 44px); }
  table.tests tr.hit { background: var(--band2); }
  table.tests td.p { width: 20%; }
  table.tests td.s { width: 50%; }
  table.tests td.n { white-space: nowrap; }
  table.tests tfoot td { font-weight: 600; border-top: 1px solid var(--fg); }
</style>
</head>
<body>
<main>
  <h1>Test Results</h1>
  <div class="how" id="how"></div>
  <div class="tablewrap" id="wrap"></div>
</main>
<script src="assets/site.js?v=4af39a6-1794675964"></script>
<script>
(async () => {
  try {
    const meta = await M2.load("meta.json");
    M2.header(meta, "next_results.html");
    const [idx, sid] = [await M2.sets(), await M2.currentSet()];
    const set = idx.sets.find((x) => x.id === sid) || {};
    const which = `the world ${M2.esc(set.world || "shown")} and its forecast for ${M2.esc(set.as_of || meta.as_of)}`;
    let res = null, rep = null;
    try { res = await M2.load("testresults.json"); } catch (e) { /* no tests run for this set */ }
    try { rep = await M2.load("improvements.json"); } catch (e) { /* no possible fixes */ }
    const how = document.getElementById("how");
    if (!res) {
      how.innerHTML = `No fixes have been tested for ${which} yet. Each fix on the <a href="next_plan.html">testing
        plan</a> will be listed here once it is tested, with what the test found, how long it took and what it cost.`;
      return;
    }
    how.innerHTML = `What happened when the fixes on the <a href="next_plan.html">testing plan</a> for ${which} were
      tested, earliest first. Each test was carried out by an agent that made the change and ran the checks its fix
      describes; the summary says what it found. <b>Runtime</b> is from the start of the test to its result, and
      <b>cost</b> is the cloud computing it used. Each result has its own lasting id (point at one for the whole id).`;
    const title = (n) => rep ? rep.problems[n] : "";
    const dur = (h) => h < 1 ? `${Math.round(h * 60)} minutes` : `${h.toFixed(1)} hours`;
    const rows = res.results;
    const hrs = rows.reduce((a, r) => a + r.runtime_hours, 0), usd = rows.reduce((a, r) => a + r.cost_usd, 0);
    document.getElementById("wrap").innerHTML = `<table class="tests"><thead><tr><th>Fix</th><th>Problem</th><th>What Happened</th>`
      + `<th>Tested</th><th>Runtime</th><th>Cost</th></tr></thead><tbody>`
      + rows.map((r) => {
        const n = parseInt(r.label, 10);
        return `<tr id="result-${M2.esc(r.id)}"><td class="id"><a href="next_improvements.html#fix-${r.label}">${r.label}</a>`
          + `<span class="pid" title="This result's lasting id: ${M2.esc(r.id)}">${M2.esc(r.id.slice(0, 8))}</span></td>`
          + `<td class="p"><a href="next_problems.html#problem-${n}">${n}. ${M2.esc(title(n))}</a></td>`
          + `<td class="s">${M2.esc(r.summary)}</td><td class="n">${M2.esc(r.started_utc.slice(0, 10))}</td>`
          + `<td class="n">${dur(r.runtime_hours)}</td><td class="n">$${r.cost_usd.toFixed(2)}</td></tr>`;
      }).join("")
      + `</tbody><tfoot><tr><td colspan="4">${rows.length === 1 ? "1 test" : `All ${rows.length} tests`}</td><td class="n">${dur(hrs)}</td><td class="n">$${usd.toFixed(2)}</td></tr></tfoot></table>`;
    const go = () => {   // a link to one result (#result-<id>): mark and scroll to its row
      document.querySelectorAll("tr.hit").forEach((el) => el.classList.remove("hit"));
      const el = location.hash && document.getElementById(decodeURIComponent(location.hash.slice(1)));
      if (el) { el.classList.add("hit"); el.scrollIntoView(); }
    };
    go();
    addEventListener("hashchange", go);
  } catch (e) { M2.fail(e); }
})();
</script>
</body>
</html>
