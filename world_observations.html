<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Observations · Model 2 (dev)</title>
<link rel="stylesheet" href="assets/site.css?v=6afc0f9-1794517867">
<link rel="stylesheet" href="assets/datamodel.css?v=6afc0f9-1794517867">
<style>
  .spark { display: block; }
  .spark rect { fill: var(--accent); fill-opacity: 0.55; }
  td.what { min-width: 260px; max-width: 420px; }
  .nav .side { height: calc(100vh - 300px); min-height: 440px; max-height: none; overflow: hidden; display: flex; flex-direction: column; }
  .nav .side > * { flex: none; }
  .filters { display: grid; grid-template-columns: auto 1fr; gap: 4px 6px; margin: 8px 0 4px; font-size: 12px; color: var(--muted); }
  .filters label { display: contents; }
  .filters select { font-size: 12px; padding: 2px 4px; min-width: 0; }
  .fcount { font-size: 12px; color: var(--muted); margin: 4px 0 0; display: flex; justify-content: space-between; gap: 6px; }
  .linkbtn { font: inherit; border: none; background: none; color: var(--accent); cursor: pointer; padding: 0; }
  .about { font-size: 12px; margin: 6px 0 0; padding: 4px 8px; border-radius: 6px; background: var(--band2); }
  .mainc { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .plot { border: 1px solid var(--line); border-radius: 6px; background: var(--panel); padding: 6px 8px 4px; }
  .plot svg { display: block; width: 100%; height: auto; }
  .plot text { fill: var(--muted); font-size: 10px; }
  .plot .grid { stroke: var(--grid); }
  .plot .pt { cursor: pointer; }
  .plot .pt:hover { stroke: var(--fg); stroke-width: 1.5; }
  .plot .cap { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 2px 12px; margin: 0 0 2px; }
  .plot .cap i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; vertical-align: -1px; }
  .plot.mini { border: none; padding: 0; background: none; max-width: 760px; }
  .tbl { height: calc(100vh - 300px); min-height: 440px; overflow: auto; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); }
  .tbl table { font-size: 12.5px; }
  .tbl th { position: sticky; top: 0; background: var(--panel); z-index: 1; }
  .tbl tr.obs { cursor: pointer; }
  #types tr.kind { cursor: pointer; }
  #types tr.kind.open td { background: var(--band); }
  #types tr.kplot td { background: var(--band2); }
  .tbl tr.obs.open td { background: var(--band); }
  .tbl tr.det td { background: var(--band2); }
  .dkv { display: grid; grid-template-columns: 150px 1fr; gap: 4px 12px; padding: 6px 4px; }
  .dkv .k { color: var(--muted); font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.04em; }
  .more { margin: 8px; }
  @media (max-width: 760px) { .nav .side { height: auto; } .tbl { height: 520px; } }
</style>
</head>
<body>
<main>
  <h1>Observations</h1>
  <p class="sub" id="intro"></p>
  <div class="tabs" id="views" role="tablist" aria-label="View">
    <button type="button" role="tab" data-v="every">Every observation</button>
    <button type="button" role="tab" data-v="kinds">Kinds</button>
  </div>

  <section data-v="every">
  <div class="layout nav">
    <aside class="side">
      <input type="search" id="q" placeholder="Subject name contains…" aria-label="Subject name contains">
      <div class="filters" id="filters">
        <label>Kind <select data-f="type"></select></label>
        <label>Sector <select data-f="sector"></select></label>
        <label>About <select data-f="skind"></select></label>
        <label>Source <select data-f="source"></select></label>
        <label>From <select data-f="from"></select></label>
        <label>To <select data-f="to"></select></label>
        <label>Named by <select data-f="named"></select></label>
      </div>
      <div id="aboutent"></div>
      <div class="fcount"><span id="count"></span> <button type="button" id="clear" class="linkbtn">Clear</button></div>
    </aside>
    <div class="mainc dm">
      <div class="tbl"><table id="rows"></table><div id="more"></div></div>
    </div>
  </div>
  </section>

  <section data-v="kinds" hidden>
  <p class="sub">Click a kind to see its readings over time.</p>
  <div class="tablewrap dm"><table id="types"></table></div>
  </section>
</main>
<script src="assets/site.js?v=6afc0f9-1794517867"></script>
<script>
(async () => {
  try {
    const [meta, ev, ob, gs] = await Promise.all([M2.load("meta.json"), M2.load("evidence.json"),
                                                  M2.load("observations.json"), M2.load("groupings.json")]);
    M2.header(meta, "world_observations.html");
    const R = ob.rows, N = R.id.length, years = ev.timeline.years;
    const label = (t) => M2.OBS[t]?.[0] || t.replace(/_/g, " ");
    const unitOf = Object.fromEntries(ev.types.map((t) => [t.name, t.unit]));
    const sec = Object.fromEntries(meta.sectors.map((s) => [s.code, s]));
    const SUBJECT = { entity: "entity", company: "company", segment: "segment", site: "site", sector: "sector",
                      census_cell: "census cell", region: "region", custom: "custom grouping" };
    const first = R.published[0], last = R.published[N - 1];
    document.getElementById("intro").innerHTML = `The world publishes ${N.toLocaleString()} observations of
      ${ob.types.length} kinds from ${ob.sources.length} sources, from ${first.slice(0, 7)} to ${last.slice(0, 7)}. Each is one
      reading about an entity or a grouping of entities, covering a month or a quarter, and published some time after.
      A run sees only those published by its date.`;

    // ---- kinds view (one row per kind of observation)
    const spark = (row) => {
      if (!row) return "";
      const mx = Math.max(...row, 1), w = 4, h = 22;
      return `<svg class="spark" width="${row.length * w}" height="${h}" role="img" aria-label="readings per year">${row.map((v, i) =>
        `<rect x="${i * w}" y="${h - (v / mx) * h}" width="${w - 1}" height="${(v / mx) * h}"><title>${years[i]}: ${v}</title></rect>`).join("")}</svg>`;
    };
    const delay = (d) => { if (d == null) return ""; if (d < 45) return `${Math.round(d)} days`; const m = Math.round(d / 30.4); return m === 1 ? "1 month" : `${m} months`; };
    const kinds = ev.types.filter((t) => t.n > 0).sort((a, b) => b.n - a.n);
    document.getElementById("types").innerHTML = `<tr><th>Observation</th><th>What it is</th><th>About</th><th>Typical sources</th>
      <th class="n">Readings</th><th class="n">Published after</th><th>Readings per year, ${years[0]}–${years[years.length - 1]}</th></tr>` +
      kinds.map((t) => {
        const o = M2.OBS[t.name];
        return `<tr class="kind" data-t="${t.name}"><td><b><a href="?v=every&type=${t.name}">${M2.esc(label(t.name))}</a></b></td>
          <td class="what">${M2.esc(o ? o[2] : t.definition)}</td>
          <td>${t.subjects.map((s) => SUBJECT[s] || s).join(", ")}</td>
          <td class="muted">${M2.esc(o ? o[4] : Object.keys(t.sources).join(", "))}</td>
          <td class="n">${t.n.toLocaleString()}</td><td class="n">${delay(t.lag_median_days)}</td>
          <td>${spark(ev.timeline.rows[t.name])}</td></tr>`;
      }).join("");

    // ---- every observation: filters
    const F = { type: "", sector: "", skind: "", source: "", from: "", to: "", named: "", entity: "" };
    Object.keys(F).forEach((k) => { F[k] = M2.param(k) || ""; });
    const ents = await M2.load("entities.json").catch(() => []);
    const entName = Object.fromEntries(ents.map((e) => [e.id, e.name]));
    // the subjects that cover an entity: the entity itself and every grouping it belongs to
    const covers = (eid) => new Set([`entity:${eid}`, ...gs.filter((g) => g.members.some((m) => m.id === eid)).map((g) => g.id)]);
    const subjIdx = new Map(ob.subjects.map((s, i) => [s.id, i]));
    const sel_ = (f) => document.querySelector(`#filters select[data-f="${f}"]`);
    const opts = (f, pairs) => { const cur = F[f]; sel_(f).innerHTML = `<option value="">all</option>` + pairs; sel_(f).value = cur; if (sel_(f).value !== cur) F[f] = ""; };
    const yrs = [...new Set(R.published.map((p) => p.slice(0, 4)))].sort();
    opts("type", ob.types.map((t, i) => [i, label(t)]).sort((a, b) => a[1].localeCompare(b[1])).map(([i, l]) => `<option value="${ob.types[i]}">${M2.esc(l)}</option>`).join(""));
    opts("sector", meta.sectors.map((s) => `<option value="${s.code}">${M2.esc(s.short)}</option>`).join(""));
    opts("skind", Object.entries(SUBJECT).filter(([k]) => ob.subjects.some((s) => s.kind === k)).map(([k, l]) => `<option value="${k}">${l}</option>`).join(""));
    opts("source", ob.sources.map((s) => `<option>${M2.esc(s)}</option>`).join(""));
    opts("from", yrs.map((y) => `<option>${y}</option>`).join(""));
    opts("to", yrs.map((y) => `<option>${y}</option>`).join(""));
    opts("named", ob.named_by.map((l, i) => `<option value="${i}">${l}</option>`).join(""));

    let shown = [], limit = 300, openRow = -1;
    const apply = () => {
      const q = document.getElementById("q").value.toLowerCase();
      const ti = F.type ? ob.types.indexOf(F.type) : -1, si = F.source ? ob.sources.indexOf(F.source) : -1;
      const okSubj = ob.subjects.map((s) => (!F.sector || s.sector.split(",").includes(F.sector)) && (!F.skind || s.kind === F.skind)
        && (!q || s.name.toLowerCase().includes(q)));
      const cov = F.entity ? new Set([...covers(F.entity)].map((x) => subjIdx.get(x)).filter((x) => x != null)) : null;
      shown = [];
      for (let i = N - 1; i >= 0; i--) {                 // newest first
        if (ti >= 0 && R.type[i] !== ti) continue;
        if (si >= 0 && R.source[i] !== si) continue;
        if (!okSubj[R.subject[i]]) continue;
        if (cov && !cov.has(R.subject[i])) continue;
        if (F.named !== "" && R.named[i] !== +F.named) continue;
        const y = R.published[i].slice(0, 4);
        if ((F.from && y < F.from) || (F.to && y > F.to)) continue;
        shown.push(i);
      }
      limit = 300; openRow = -1;
      document.getElementById("count").textContent = `${shown.length.toLocaleString()} of ${N.toLocaleString()} observations`;
      document.getElementById("aboutent").innerHTML = F.entity ? `<div class="about">About <a href="world_entities.html?v=every&e=${encodeURIComponent(F.entity)}">${M2.esc(entName[F.entity] || F.entity)}</a>
        or a grouping it belongs to · <button type="button" class="linkbtn" id="dropent">remove</button></div>` : "";
      drawRows();
    };
    const subjLink = (s) => {
      if (!s || !s.id) return `<span class="muted">unresolved</span>`;
      const [kind, id] = [s.kind, s.id.slice(s.kind.length + 1)];
      return kind === "entity" ? `<a href="world_entities.html?v=every&e=${encodeURIComponent(id)}">${M2.esc(s.name)}</a>`
        : `<a href="world_entities.html?v=every&grouping=${encodeURIComponent(s.id)}">${M2.esc(s.name)}</a> <span class="muted">${SUBJECT[kind] || kind}</span>`;
    };
    const fmtVal = (i) => { const v = R.value[i], t = ob.types[R.type[i]]; return v == null ? "–" : M2.fmt(v, unitOf[t] === "share" ? "share" : ""); };
    const period = (i) => R.start[i] === R.end[i] ? R.start[i] : `${R.start[i]} to ${R.end[i]}`;
    const detail = (i) => {
      const t = ob.types[R.type[i]], s = ob.subjects[R.subject[i]], o = M2.OBS[t];
      const g = s && s.kind !== "entity" ? gs.find((x) => x.id === s.id) : null;
      const end = new Date(`${R.end[i]}-01`); end.setMonth(end.getMonth() + 1);
      const lag = Math.round((new Date(R.published[i]) - end) / 864e5);
      const row = (k, v) => `<span class="k">${k}</span><span>${v}</span>`;
      return `<tr class="det"><td colspan="6"><div class="dkv">
        ${row("Observation", `<span class="mono">${M2.esc(R.id[i])}</span>`)}
        ${row("Kind", `<b>${M2.esc(label(t))}</b>${o ? ` <span class="muted">${M2.esc(o[2])}</span>` : ""}`)}
        ${row("About", subjLink(s))}
        ${g ? row("Covers", `${g.members.length} entities: ${g.members.slice(0, 12).map((m) => `<a href="world_entities.html?v=every&e=${encodeURIComponent(m.id)}">${M2.esc(m.name)}</a>`).join(", ")}${g.members.length > 12 ? ", …" : ""}`) : ""}
        ${row("Period", period(i))}
        ${row("Value", `${fmtVal(i)} <span class="muted">${M2.esc(unitOf[t] || "")}</span>`)}
        ${row("Published", `${R.published[i]} <span class="muted">(${lag >= 0 ? `${lag} days after the period ended` : "before the period ended"})</span>`)}
        ${row("Source", M2.esc(ob.sources[R.source[i]]))}
        ${row("Subject named by", `${ob.named_by[R.named[i]]}${R.ref[i] ? ` <span class="mono">${M2.esc(R.ref[i])}</span>` : ""}`)}
        ${R.sensor[i] ? row("Sensor", M2.esc(R.sensor[i])) : ""}
      </div>
      <div class="plot mini">${(() => {
        const same = []; for (let j = 0; j < N; j++) if (R.subject[j] === R.subject[i] && R.type[j] === R.type[i]) same.push(j);
        return `<div class="cap"><span>Every ${M2.esc(label(t).toLowerCase())} reading about ${M2.esc(s?.name || "this subject")} (${same.length}); this one in orange</span></div>`
          + series(same, { h: 150, hi: i, colors: 1, legend: false });
      })()}</div></td></tr>`;
    };
    // ---- charts: the values of the selected observations over time
    const mIdx = (m) => +m.slice(0, 4) * 12 + (+m.slice(5, 7) - 1);
    const COLORS = [1, 2, 3, 4, 5, 6, 7, 8].map((k) => `var(--dm-${k})`);
    const series = (idx, o = {}) => {             // idx: observation indexes of one kind
      const W = 900, H = o.h || 210, L = 58, Rm = 10, T = 8, B = 20;
      const pts = idx.filter((i) => R.value[i] != null);
      if (!pts.length) return `<p class="muted">No values to plot.</p>`;
      const xs = pts.map((i) => mIdx(R.end[i])), vs = pts.map((i) => R.value[i]);
      let x0 = Math.min(...xs), x1 = Math.max(...xs); if (x1 === x0) { x0 -= 6; x1 += 6; }
      const pos = vs.every((v) => v > 0), lo0 = Math.min(...vs), hi0 = Math.max(...vs);
      const log = pos && hi0 / lo0 > 100;
      const f = log ? Math.log10 : (v) => v;
      let lo = f(lo0), hi = f(hi0); const pad = (hi - lo) * 0.06 || Math.abs(hi) * 0.1 || 1; lo -= pad; hi += pad;
      if (!log && lo0 >= 0 && lo < 0) lo = 0;      // no axis below zero for values that cannot be negative
      const X = (m) => L + (m - x0) / (x1 - x0) * (W - L - Rm), Y = (v) => T + (1 - (f(v) - lo) / (hi - lo)) * (H - T - B);
      const unit = unitOf[ob.types[R.type[pts[0]]]] === "share" ? "share" : "";
      let g = "";
      for (let k = 0; k <= 4; k++) {
        const fv = lo + (hi - lo) * k / 4, v = log ? 10 ** fv : fv, y = T + (1 - k / 4) * (H - T - B);
        g += `<line class="grid" x1="${L}" x2="${W - Rm}" y1="${y}" y2="${y}"/><text x="${L - 4}" y="${y + 3}" text-anchor="end">${M2.fmt(v, unit)}</text>`;
      }
      const ys0 = Math.floor(x0 / 12), ys1 = Math.floor(x1 / 12), every = Math.max(1, Math.ceil((ys1 - ys0) / 10));
      for (let yy = ys0 + 1; yy <= ys1; yy++) if ((yy - ys0) % every === 0) g += `<text x="${X(yy * 12)}" y="${H - 5}" text-anchor="middle">${yy}</text>`;
      // one line per subject: the most frequent subjects in colour, the rest grey
      const bySub = new Map();
      pts.forEach((i) => { const s = R.subject[i]; (bySub.get(s) || bySub.set(s, []).get(s)).push(i); });
      const order = [...bySub.entries()].sort((a, b) => b[1].length - a[1].length);
      const col = new Map(order.slice(0, o.colors ?? 8).map(([s], k) => [s, COLORS[k]]));
      let lines = "", dots = "";
      for (const [s, is] of [...order].reverse()) {
        const c = col.get(s) || "var(--muted)", srt = [...is].sort((a, b) => mIdx(R.end[a]) - mIdx(R.end[b]));
        if (srt.length > 1) lines += `<polyline fill="none" stroke="${c}" stroke-opacity="${col.has(s) ? 0.7 : 0.25}" stroke-width="1.2" points="${srt.map((i) => `${X(mIdx(R.end[i]))},${Y(R.value[i])}`).join(" ")}"/>`;
        dots += srt.map((i) => `<circle class="pt" data-i="${i}" cx="${X(mIdx(R.end[i]))}" cy="${Y(R.value[i])}" r="${i === o.hi ? 5.5 : 2.6}"
          fill="${i === o.hi ? "var(--truth)" : c}" fill-opacity="${col.has(s) || i === o.hi ? 0.9 : 0.4}"><title>${M2.esc(ob.subjects[s]?.name || "unresolved")} · ${period(i)}: ${fmtVal(i)}</title></circle>`).join("");
      }
      const cap = o.legend === false ? "" : `<div class="cap">${order.slice(0, o.colors ?? 8).map(([s], k) =>
        `<span><i style="background:${COLORS[k]}"></i>${M2.esc(ob.subjects[s]?.name || "unresolved")}</span>`).join("")}${order.length > 8 ? `<span><i style="background:var(--muted)"></i>${order.length - 8} others</span>` : ""}${log ? `<span>log scale</span>` : ""}</div>`;
      return `${cap}<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="values over time">${g}${lines}${dots}</svg>`;
    };
    const drawRows = () => {
      const xs = shown.slice(0, limit);
      document.getElementById("rows").innerHTML = `<tr><th>Published</th><th>Kind</th><th>About</th><th>Period</th><th class="n">Value</th><th>Source</th></tr>` +
        xs.map((i) => `<tr class="obs${i === openRow ? " open" : ""}" data-i="${i}"><td>${R.published[i]}</td><td>${M2.esc(label(ob.types[R.type[i]]))}</td>
          <td>${subjLink(ob.subjects[R.subject[i]])}</td><td>${period(i)}</td><td class="n">${fmtVal(i)}</td>
          <td class="muted">${M2.esc(ob.sources[R.source[i]])}</td></tr>${i === openRow ? detail(i) : ""}`).join("");
      document.getElementById("more").innerHTML = shown.length > limit
        ? `<button type="button" class="linkbtn more" id="morebtn">Show ${Math.min(300, shown.length - limit)} more (${(shown.length - limit).toLocaleString()} not shown)</button>` : "";
    };
    const url = () => {
      const p = new URLSearchParams({ v: view });
      if (view === "every") Object.entries(F).forEach(([k, v]) => v && p.set(k, v));
      history.replaceState(null, "", `?${p}`);
    };
    document.getElementById("rows").addEventListener("click", (e) => {
      if (e.target.closest("a")) return;
      const tr = e.target.closest("tr.obs");
      if (!tr) return;
      openRow = +tr.dataset.i === openRow ? -1 : +tr.dataset.i;
      drawRows();
    });
    document.getElementById("more").addEventListener("click", (e) => { if (e.target.id === "morebtn") { limit += 300; drawRows(); } });
    document.getElementById("filters").addEventListener("change", (e) => { const f = e.target.dataset.f; if (f) { F[f] = e.target.value; apply(); url(); } });
    document.getElementById("q").addEventListener("input", apply);
    document.getElementById("aboutent").addEventListener("click", (e) => { if (e.target.id === "dropent") { F.entity = ""; apply(); url(); } });
    document.getElementById("clear").addEventListener("click", () => {
      Object.keys(F).forEach((k) => { F[k] = ""; }); document.getElementById("q").value = "";
      document.querySelectorAll("#filters select").forEach((s) => { s.value = ""; }); apply(); url();
    });

    // Kinds view: a row opens into a chart of that kind's readings over time, every subject
    let openKind = "";
    const kindsTable = document.getElementById("types");
    kindsTable.addEventListener("click", (e) => {
      if (e.target.closest("a") || e.target.closest(".plot")) return;
      const tr = e.target.closest("tr.kind");
      if (!tr) return;
      kindsTable.querySelectorAll("tr.kplot").forEach((r) => r.remove());
      kindsTable.querySelectorAll("tr.kind.open").forEach((r) => r.classList.remove("open"));
      if (openKind === tr.dataset.t) { openKind = ""; return; }
      openKind = tr.dataset.t;
      const ti = ob.types.indexOf(openKind), idx = [];
      for (let j = 0; j < N; j++) if (R.type[j] === ti) idx.push(j);
      tr.classList.add("open");
      tr.insertAdjacentHTML("afterend", `<tr class="kplot"><td colspan="7"><div class="plot">${series(idx)}</div>
        <div class="muted" style="font-size:12px;margin:4px 2px">${idx.length.toLocaleString()} readings ·
        <a href="?v=every&type=${openKind}">browse them</a></div></td></tr>`);
    });
    kindsTable.addEventListener("click", (e) => {             // a dot opens that reading in the navigator
      const c = e.target.closest(".pt");
      if (c) location.href = `?v=every&type=${openKind}&open=${encodeURIComponent(R.id[+c.dataset.i])}`;
    });

    // ---- views
    let view = M2.param("v") === "kinds" ? "kinds" : "every";
    const showView = () => {
      document.querySelectorAll("#views button").forEach((b) => { b.classList.toggle("on", b.dataset.v === view); b.setAttribute("aria-selected", b.dataset.v === view); });
      document.querySelectorAll("main section[data-v]").forEach((x) => { x.hidden = x.dataset.v !== view; });
    };
    document.getElementById("views").addEventListener("click", (e) => { const b = e.target.closest("button[data-v]"); if (b) { view = b.dataset.v; showView(); url(); } });
    showView();
    apply();
    if (M2.param("kind")) kindsTable.querySelector(`tr.kind[data-t="${M2.param("kind")}"] td:nth-child(2)`)?.click();   // ?kind= opens one
    const want = M2.param("open");                       // ?open=<observation id> opens that observation
    if (want) {
      const i = R.id.indexOf(want), k = shown.indexOf(i);
      if (k >= 0) { openRow = i; limit = Math.max(limit, k + 1); drawRows(); document.querySelector("tr.obs.open")?.scrollIntoView({ block: "nearest" }); }
    }
  } catch (e) { M2.fail(e); }
})();
</script>
</body>
</html>
